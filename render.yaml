services:
  - type: web
    name: sessiondesk
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: MEMWAL_SERVER_URL
        value: https://relayer.memory.walrus.xyz

      - key: COMMUNITY_KEY
        sync: false

      - key: NAMESPACE_SECRET
        generateValue: true

      - key: SETUP_CODE
        generateValue: true

      - key: MEMWAL_A_ACCOUNT_ID
        sync: false
      - key: MEMWAL_A_PRIVATE_KEY
        sync: false

      - key: MEMWAL_B_ACCOUNT_ID
        sync: false
      - key: MEMWAL_B_PRIVATE_KEY
        sync: false

      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_MEMBER_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MANAGER_BOT_TOKEN
        sync: false

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b

      - key: DISCORD_ENABLED
        value: "false"
      - key: SLACK_ENABLED
        value: "false"
